name: Publish Rust crate to crates.io

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful Alpha distribution artifacts dispatch run ID
        required: true
        type: string
      source_sha:
        description: Full 40-character reviewed source commit from that run
        required: true
        type: string
      package:
        description: Approved crate name from just release-status (dependency order)
        required: true
        type: choice
        options: ['all', 'tamil-core', 'tamil-norm', 'tamil-collate', 'tamil-numerals', 'tamil-codec', 'tamil-toolkit']
        default: 'all'
      confirm_publish:
        description: Choose publish after artifact review and release authorization
        required: true
        type: choice
        options: ['no', 'publish']
        default: 'no'

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm_publish == 'publish' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          name: alpha-rust
          path: ${{ runner.temp }}/release-artifacts/rust
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Validate artifact run and reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACTS: ${{ runner.temp }}/release-artifacts
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "$RUNNER_TEMP/artifact-run.json"
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/alpha-artifacts.yml" --jq '.id')"
          python tools/release_policy.py verify-run --directory "$ARTIFACTS" --source-sha "$SOURCE_SHA" --run-info "$RUNNER_TEMP/artifact-run.json" --workflow-id "$workflow_id"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify source, versions, scope, and artifact hashes
        id: verify
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACTS: ${{ runner.temp }}/release-artifacts
          PACKAGE: ${{ inputs.package }}
        run: python tools/release_policy.py verify --registry crates.io --directory "$ARTIFACTS" --source-sha "$SOURCE_SHA" --package "$PACKAGE"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Repackage, compare, and publish reviewed crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ steps.verify.outputs.version }}
          PACKAGES: ${{ steps.verify.outputs.packages }}
          REVIEWED: ${{ steps.verify.outputs.crate }}
          ARTIFACTS: ${{ runner.temp }}/release-artifacts
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "Configure CARGO_REGISTRY_TOKEN in GitHub Actions" >&2; exit 1; }
          if [ "$PACKAGE" = "all" ]; then
            CRATES="$PACKAGES"
          else
            CRATES="$PACKAGE"
          fi
          for pkg in $CRATES; do
            echo "=== Processing crate $pkg $VERSION ==="
            if python tools/release_policy.py is-published --registry crates.io --package "$pkg" --version "$VERSION"; then
              echo "Crate $pkg $VERSION is already published to crates.io; skipping."
              continue
            fi
            cargo package --locked --package "$pkg" --no-verify
            if [ -n "${REVIEWED:-}" ] && [ "$PACKAGE" != "all" ]; then
              python tools/release_policy.py compare-crate --reviewed "$REVIEWED" --built "target/package/${pkg}-${VERSION}.crate"
            else
              python tools/release_policy.py compare-crate --directory "$ARTIFACTS" --package "$pkg" --built "target/package/${pkg}-${VERSION}.crate"
            fi
            cargo publish --locked --package "$pkg"
            for attempt in $(seq 1 12); do
              if python tools/release_policy.py is-published --registry crates.io --package "$pkg" --version "$VERSION"; then
                echo "Crate $pkg $VERSION is now available on crates.io."
                break
              fi
              sleep 5
            done
          done
