name: Alpha distribution artifacts

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed source ref or full commit to package
        required: true
        type: string
        default: master

# Expensive distribution checks are explicit; ordinary pushes use ci.yml.
permissions:
  contents: read

concurrency:
  group: alpha-artifacts
  cancel-in-progress: true

jobs:
  source:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/release_policy.py check
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  rust:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/release.py rust
      - run: python tools/release_policy.py record --directory target/alpha
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-rust
          path: target/alpha/
          if-no-files-found: error

  rust-minimum:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - run: cargo check --locked -p tamil-toolkit --lib

  npm:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python tools/release.py npm
      - run: python tools/release_policy.py record --directory target/alpha
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-npm-node${{ matrix.node }}
          path: target/alpha/
          if-no-files-found: error

  python:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2014'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/release.py stage-python
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.16.0
          rust-toolchain: 1.95.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: target/alpha/python-source/bindings/python
          args: --release --locked --sdist --out dist
      - run: python tools/release_policy.py record --directory target/alpha/python-source/bindings/python/dist
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-python-${{ matrix.target }}
          path: target/alpha/python-source/bindings/python/dist/
          if-no-files-found: error

  python-consumers:
    needs: [source, python]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
        python: ['3.11', '3.14']
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: alpha-python-${{ matrix.target }}
          path: wheel-artifacts
      - name: Test the installed wheel, without editable bindings
        shell: bash
        run: python tools/release.py verify-wheel --wheel wheel-artifacts/*.whl
