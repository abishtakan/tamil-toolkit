name: Publish release (crates.io, npm, PyPI)

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful Alpha distribution artifacts dispatch run ID
        required: true
        type: string
      source_sha:
        description: Full 40-character reviewed source commit from that run
        required: true
        type: string
      confirm_publish:
        description: Choose publish after artifact review and release authorization
        required: true
        type: choice
        options: ['no', 'publish']
        default: 'no'

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-release
  cancel-in-progress: false

# Dispatches the individual registry publisher workflows so npm and PyPI OIDC
# trusted-publisher tokens always originate from their registered workflow
# filenames (`publish-npm.yml` and `publish-pypi.yml`).
jobs:
  dispatch:
    if: ${{ inputs.confirm_publish == 'publish' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          name: alpha-rust
          path: ${{ runner.temp }}/release-artifacts/rust
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Validate artifact run and reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACTS: ${{ runner.temp }}/release-artifacts
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "$RUNNER_TEMP/artifact-run.json"
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/alpha-artifacts.yml" --jq '.id')"
          python tools/release_policy.py verify-run --directory "$ARTIFACTS" --source-sha "$SOURCE_SHA" --run-info "$RUNNER_TEMP/artifact-run.json" --workflow-id "$workflow_id"

      - name: Dispatch registry publisher workflows
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          gh workflow run publish-crate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f artifact_run_id="$RUN_ID" \
            -f source_sha="$SOURCE_SHA" \
            -f package=all \
            -f confirm_publish=publish

          gh workflow run publish-npm.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f artifact_run_id="$RUN_ID" \
            -f source_sha="$SOURCE_SHA" \
            -f confirm_publish=publish

          gh workflow run publish-pypi.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f artifact_run_id="$RUN_ID" \
            -f source_sha="$SOURCE_SHA" \
            -f confirm_publish=publish

          {
            echo "### Dispatched registry publishers"
            echo ""
            echo "- Artifact run: \`${RUN_ID}\`"
            echo "- Reviewed source SHA: \`${SOURCE_SHA}\`"
            echo "- Workflows dispatched on \`master\`: \`publish-crate.yml\` (\`package=all\`), \`publish-npm.yml\`, \`publish-pypi.yml\`"
            echo "- Note: \`publish-pypi.yml\` still requires \`pypi\` environment reviewer approval."
          } >> "$GITHUB_STEP_SUMMARY"
