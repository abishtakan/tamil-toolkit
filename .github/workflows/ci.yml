name: Core Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The full Python/WASM/Dart parity and harness gate remains available locally
# through `just agent-pre-stop-gate` and `just test-dart`.
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --locked --python 3.13
      - run: just agent-post-edit
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: just test-rust
