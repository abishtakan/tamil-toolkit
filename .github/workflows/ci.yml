name: Core Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

# The full Python/WASM/Dart parity and harness gate remains available locally
# through `just agent-pre-stop-gate` and `just test-dart`.
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          asset="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${asset}" \
            --output "$RUNNER_TEMP/${asset}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${asset}" \
            | (cd "$RUNNER_TEMP" && sha256sum --check --strict)
          tar -xzf "$RUNNER_TEMP/${asset}" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --locked --python 3.13
      - run: just agent-post-edit
      - run: uv run --locked pytest tests/harness/test_release_policy.py tests/harness/test_release_acceptance.py -q
      - run: actionlint
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: just test-rust
