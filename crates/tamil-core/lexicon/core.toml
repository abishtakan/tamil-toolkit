# Declarative Unicode facts, not a vocabulary lexicon.
# Sources: https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-12/
#          https://www.unicode.org/Public/17.0.0/ucd/NamedSequences.txt
version = 1
pulli = "\u0BCD"
aytham = "ஃ"
# Project tailoring: these sequences are atomic for get_letters, unlike plain UAX 29.
atomic_letters = ["க்ஷ", "ஶ்ரீ", "ஸ்ரீ"]

[consonants]
vallinam = ["க", "ச", "ட", "த", "ப", "ற"]
mellinam = ["ங", "ஞ", "ண", "ந", "ம", "ன"]
idaiyinam = ["ய", "ர", "ல", "வ", "ழ", "ள"]
grantha = ["ஜ", "ஶ", "ஷ", "ஸ", "ஹ", "க்ஷ"]

# Each pair is [independent vowel, dependent vowel sign]; empty means inherent A.
[[vowels]]
uyir = "அ"
sign = ""
