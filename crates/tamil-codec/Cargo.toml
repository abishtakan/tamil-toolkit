[package]
name = "tamil-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tamil-codec/0.1.0-alpha.7"
include = ["src/**", "build*.rs", "lexicon/*.toml", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "Versioned legacy encodings and orthography conversion"

[dependencies]
tamil-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]

[build-dependencies]
serde.workspace = true
toml.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[[bench]]
name = "codec_detection"
harness = false
