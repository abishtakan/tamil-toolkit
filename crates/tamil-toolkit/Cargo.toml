[package]
name = "tamil-toolkit"
version.workspace = true
edition.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tamil-toolkit/0.2.0"
include = [
  "src/**",
  "build*.rs",
  "lexicon/*.toml",
  "README.md",
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
]
rust-version.workspace = true
description = "All-in-one Rust Tamil linguistic engine: Unicode rules, Agara Varisai sorting, numerals, hyphenation, transliteration, and legacy codecs"
keywords = ["tamil", "unicode", "nlp", "agara-varisai", "bamini"]
categories = ["text-processing", "encoding", "internationalization"]

[features]
default = []
lexicon-core = []
lexicon-terminology = []
lexicon-names-taxa = []
lexicon-regional = []

[dependencies]
csv.workspace = true
tamil-core.workspace = true
tamil-norm.workspace = true
tamil-collate.workspace = true
tamil-numerals.workspace = true
tamil-calendar.workspace = true
tamil-codec.workspace = true
tamil-hyphen.workspace = true
tamil-translit.workspace = true
tamil-tokenize.workspace = true
serde.workspace = true
serde_json.workspace = true
fst.workspace = true
sha2.workspace = true

[build-dependencies]
tamil-core.workspace = true
tamil-norm.workspace = true
csv.workspace = true
fst.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
csv.workspace = true
proptest.workspace = true
toml.workspace = true

[lints]
workspace = true
