# Canonical numeric and naming data for the bounded Thirukanitham profile.
# The runtime algorithm is Rust; this file is declarative data compiled by build.rs.
# Provider source: https://github.com/saurvs/astro-rust, crate astro 2.0.0, MIT.
# Independent astronomy: https://ssd-api.jpl.nasa.gov/doc/horizons.html
# Time-zone rules: https://www.iana.org/time-zones/releases/2026f
# Lahiri anchor (true, including nutation): https://www.astro.com/swisseph/swisseph.htm section 2.8.5.
# Independent IAU 2000A nutation: https://github.com/liberfa/erfa and https://github.com/liberfa/pyerfa.
# P03 precession: https://www.iers.org/SharedDocs/Publikationen/EN/IERS/resolutions/IAU/IAU2006_Resolution_B1.pdf
# Panchang limb and sunrise rules: https://packolkata.imd.gov.in/panchang/en/explanation
# Tamil solar-month assignment: Sewell & Dikshit (1896), printed p. 12, §28; Positional Astronomy Centre, Indian Calendar, "The Tamil rule".

profile = "thirukanitham-calendar-v1"
definition_id = "thirukanitham-astro-2.0.0-lahiri-p03-apparent-v2"
sidereal_definition = "lahiri-1956-true-anchor-p03-true-iau1980-v2"
ephemeris_provider = "astro"
ephemeris_version = "2.0.0"
ephemeris_license = "MIT"
ephemeris_archive_sha256 = "199632E1A87451CF771DA7ADEBA192CAB923EDE42657AC3DE0133BA6F4AE14BE"
sun_model = "VSOP87-D"
moon_model = "partial ELP-2000/82"
nutation_model = "astro-2.0.0-63-term-iau1980"
solar_coordinate_definition = "geocentric-apparent-ecliptic-of-date:VSOP87-D-mean+FK5+IAU1980-nutation+solar-aberration;no-separate-light-time-or-gravitational-deflection"
lunar_coordinate_definition = "geocentric-apparent-ecliptic-of-date:partial-ELP-2000/82-mean+IAU1980-nutation;no-separate-FK5-lunar-aberration-light-time-or-gravitational-deflection"
sidereal_coordinate_definition = "apparent-ecliptic-of-date-longitude-minus-true-Lahiri-ayanamsa;P03-mean-anchor+same-model-date-nutation"
vara_definition = "panchangam-day:weekday-of-report-civil-date-at-computed-sunrise;panchangam-at:weekday-of-local-civil-date-including-before-sunrise;not-sunrise-to-sunrise"
