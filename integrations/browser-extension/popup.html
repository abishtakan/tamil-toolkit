<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamil Toolkit</title>
  <style>
    body {
      width: 290px;
      min-height: 170px;
    }
    .popup-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .full-btn {
      width: 100%;
      text-align: center;
      padding: 8px 12px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" width="22" height="22" role="img" aria-label="Tamil Toolkit">
        <rect width="64" height="64" rx="16" fill="#181513" />
        <circle cx="32" cy="20.8" r="8.4" fill="#e05338" />
        <circle cx="20" cy="41.6" r="8.4" fill="#faf7f2" />
        <circle cx="44" cy="41.6" r="8.4" fill="#faf7f2" />
      </svg>
      <span id="pop-brand">Tamil Toolkit</span>
    </div>
    <button class="btn sm" id="pop-lang" type="button">&#x0BA4;&#x0BAE;&#x0BBF;&#x0BB4;&#x0BCD;</button>
  </header>

  <main class="popup-body">
    <div class="card row" id="pop-live-card">
      <div>
        <strong id="pop-live-title">Live Inline Typing</strong>
        <div class="muted" id="pop-live-desc">Alt+Shift+L</div>
      </div>
      <button class="btn sm" id="pop-live-btn" type="button">OFF</button>
    </div>

    <div class="stack">
      <label class="muted" for="pop-layout" id="pop-layout-lbl">Keyboard Layout</label>
      <select id="pop-layout">
        <option value="phonetic-v1">Phonetic (Tanglish)</option>
        <option value="tamil99">Tamil99</option>
        <option value="anjal-phonetic">Anjal</option>
        <option value="suratha-bamini">Bamini / Suratha Bamini</option>
      </select>
    </div>

    <button class="btn primary full-btn" id="pop-open-panel" type="button">
      Open Side Panel (Inspect · Fix · Tools)
    </button>
  </main>

  <script type="module" src="/src/popup/main.ts"></script>
</body>
</html>
