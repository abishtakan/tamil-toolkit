# Review changes to this file as release-scope changes, before publishing.
schema = 1
branch = "master"
channel = "alpha"
registries = ["crates.io", "pypi", "npm"]
# Dependency order. A new module needs a completed specification, active golden
# parity, packaging evidence, and explicit release review before joining this list.
public_crates = [
  "tamil-core", "tamil-norm", "tamil-collate", "tamil-numerals",
  "tamil-calendar", "tamil-codec", "tamil-hyphen", "tamil-toolkit",
]

# Facade-only license scope: tamil-toolkit source packages bundle approved CC-BY-SA-4.0
# dictionary sources alongside MIT engine code. Workspace and all lower crates keep MIT.
[crate_licenses]
tamil-toolkit = "MIT AND CC-BY-SA-4.0"
