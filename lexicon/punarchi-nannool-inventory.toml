[[sutra]]
sutra = 196
chapter = "uyireeru"
tier = "closed_class"
executable = true
tva_page = 256
kandigai_sutra = 196
pm_ref = "pmuni0147#196"
summary = "Decades 10..80 (ஒருபது..எண்பது) + 1..9 insert இன் chariyai (eliding உ and ஃ before இன்)."

[[sutra]]
sutra = 197
chapter = "uyireeru"
tier = "closed_class"
executable = true
tva_page = 257
kandigai_sutra = 197
pm_ref = "pmuni0147#197"
summary = "பத்து and ஒன்பது take இன் chariyai before 1..10, ஆயிரம், கோடி, weights, measures; பத்து also takes இற்று (பதிற்று)."

[[sutra]]
sutra = 198
chapter = "uyireeru"
tier = "closed_class"
