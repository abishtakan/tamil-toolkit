[[sutra]]
sutra = 188
chapter = "uyireeru"
tier = "closed_class"
executable = true
tva_page = 250
kandigai_sutra = 188
pm_ref = "pmuni0147#188"
summary = "Base rule for numerals 1..8 (ஒன்று..எட்டு) before numbers, weights, measures, and general nouns: drops final உயிர்மெய் (except ஏழு)."

[[sutra]]
sutra = 189
chapter = "uyireeru"
tier = "closed_class"
executable = true
tva_page = 252
kandigai_sutra = 189
pm_ref = "pmuni0147#189"
summary = "Numeral stems 1 (ஒன்று->ஒரு/ஓர்) and 2 (இரண்டு->இரு/ஈர்) select short form before consonants and long form before vowels."

[[sutra]]
sutra = 190
chapter = "uyireeru"
tier = "closed_class"
executable = true
tva_page = 252
kandigai_sutra = 190
pm_ref = "pmuni0147#190"
summary = "Numeral 3 (மூன்று) becomes மூ before vowels and மு + doubled initial consonant before consonants."

[[sutra]]
sutra = 191
chapter = "uyireeru"
tier = "closed_class"
executable = true
tva_page = 252
kandigai_sutra = 191
pm_ref = "pmuni0147#191"
summary = "Numeral 4 (நான்கு) becomes நால் before vowels/idaiyinam, நாற் before vallinam, and நான் before mellinam."

[[sutra]]
sutra = 192
chapter = "uyireeru"
tier = "closed_class"
executable = true
tva_page = 253
kandigai_sutra = 192
pm_ref = "pmuni0147#192"
summary = "Numeral 5 (ஐந்து) becomes ஐ before vowels/ய/வ, homorganic nasal before vallinam, and doubles ம/ஞ before mellinam."

[[sutra]]
sutra = 193
chapter = "uyireeru"
tier = "closed_class"
executable = true
tva_page = 253
kandigai_sutra = 193
pm_ref = "pmuni0147#193"
summary = "Numeral 8 (எட்டு) converts penultimate ட் to ண் (எண்) before numbers, weights, measures, and general nouns."

[[sutra]]
sutra = 194
chapter = "uyireeru"
tier = "closed_class"
executable = true
tva_page = 254
kandigai_sutra = 194
pm_ref = "pmuni0147#194"
summary = "ஒன்பது + பத்து -> தொண்ணூறு and ஒன்பது + நூறு -> தொள்ளாயிரம் via suppletive numeral sandhi."

[[sutra]]
sutra = 195
chapter = "uyireeru"
tier = "closed_class"
executable = true
tva_page = 256
kandigai_sutra = 195
pm_ref = "pmuni0147#195"
summary = "Numerals 1..8 + பத்து yield decade forms ஒருபது/ஒருபஃது through எண்பது/எண்பஃது (dropping த் in பத்து)."
