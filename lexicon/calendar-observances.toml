# Canonical rule metadata for the finite Nava / Tamil-rule TN subset.
# Algorithms are Rust; annual publisher schedules remain independent witnesses.
rule_set_id = "thirukanitham-tamil-named-observances-v1"
profile_definition_id = "thirukanitham-astro-2.0.0-lahiri-p03-apparent-v2"
coverage_start_year = 2025
coverage_end_year = 2027
jurisdiction = "TN"
scope_note = "Bounded Tamil Nadu observance collection for Thirukanitham contexts in supported TN locations. Nava tithi/Pradosham, distinct named Drik/Udaya/Anudina/Pujadeep festival rules, Dharmasindhu moonrise Chaturthi retain separate IDs and source records; the selected astronomy model is explicit and publisher-equivalent dates are not claimed."
astronomy_note = "Toolkit Thirukanitham apparent geocentric Sun and Moon with local sunrise, sunset, and a USNO-defined geocentric Moon upper-limb rise threshold. Local Nishita windows are the eighth of fifteen equal parts of the computed night. Nava's tithi schedule source uses Vakyakarana and is only a rule/date witness. No astronomy is reused for Vakiya."
reuse_terms_status = "Nava, TamilCalendar.app, Drik, TamilCalendar.com, Udyog, and institutional calendar pages are used only for factual date and rule summaries; no page text, images, markup, or annual event table is redistributed. Nava, TamilCalendar.app, TamilCalendar.com, and Udyog reuse terms were not established; Drik states its data are copyrighted. Broader reuse permission is unverified."

