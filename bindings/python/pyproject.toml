[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "tamil-toolkit"
version = "0.3.0"
requires-python = ">=3.11"
description = "All-in-one Rust-powered Tamil linguistic engine for Python: Unicode rules, Agara Varisai sorting, numerals, hyphenation, Panchangam, and Bamini/TSCII codecs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.txt"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Rust", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: Implementation :: CPython"]
keywords = ["tamil", "unicode", "nlp", "rust", "agara varisai", "number to words", "bamini", "tscii", "panchangam", "hyphenation"]

[project.urls]
Homepage = "https://tamil-toolkit-playground.vercel.app/"
Repository = "https://github.com/abishtakan/tamil-toolkit"
Documentation = "https://github.com/abishtakan/tamil-toolkit#readme"
Changelog = "https://github.com/abishtakan/tamil-toolkit/blob/master/CHANGELOG.md"
Issues = "https://github.com/abishtakan/tamil-toolkit/issues"

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "tamil_toolkit._native"
include = [{ path = "THIRD_PARTY_LICENSES.txt", format = "sdist" }]
