[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "tamil-toolkit"
version = "0.1.0"
requires-python = ">=3.11"
description = "Thin Python bindings for the Rust Tamil toolkit"
readme = "README.md"
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Rust"]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "tamil_toolkit._native"
