[package]
name = "tamil-python"
description = "Private Rust support crate for the tamil-toolkit Python distribution"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
default = []
extension-module = ["pyo3/extension-module"]
lexicon-core = ["tamil-toolkit/lexicon-core"]
lexicon-terminology = ["tamil-toolkit/lexicon-terminology"]
lexicon-names-taxa = ["tamil-toolkit/lexicon-names-taxa"]
lexicon-regional = ["tamil-toolkit/lexicon-regional"]

[dependencies]
tamil-toolkit.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py311"] }

[lints]
workspace = true
